name: Deploy Gatewav backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SECRET }}
          script: |
            cd /root/afresh/Ticketing-back
            git fetch --all
            git reset --hard origin/main
            npm install
            pm2 restart gate || pm2 start src/index.js --name gate
